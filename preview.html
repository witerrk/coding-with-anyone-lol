<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8"><title>Preview</title>
    <style>body,html,iframe { margin:0; padding:0; height:100vh; width:100vw; border:none; overflow:hidden; background:#fff; }</style>
</head>
<body>
    <iframe id="output"></iframe>
    <script>
        const params = new URLSearchParams(window.location.search);
        const targetName = params.get('file') || 'index.html';
        const iframe = document.getElementById('output');
        let lastContent = "";

        async function poll() {
            try {
                const res = await fetch('/api/action?list=true');
                const blobs = await res.json();
                const file = blobs.find(b => b.pathname === targetName);

                if (file) {
                    // Używamy Proxy API zamiast bezpośredniego linku do Bloba
                    const proxyUrl = `/api/action?getFileContents=true&url=${encodeURIComponent(file.url)}&t=${Date.now()}`;
                    const contentRes = await fetch(proxyUrl);
                    const code = await contentRes.text();

                    if (code !== lastContent) {
                        lastContent = code;
                        iframe.srcdoc = code;
                    }
                }
            } catch (e) {}
        }

        setInterval(poll, 1000);
        poll();
    </script>
</body>
</html>
