<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Preview</title>
    <style>
        body, html { margin: 0; padding: 0; height: 100vh; overflow: hidden; background: #fff; }
        iframe { border: none; width: 100%; height: 100%; display: block; }
    </style>
</head>
<body>
    <iframe id="output"></iframe>
    <script>
        const params = new URLSearchParams(window.location.search);
        const targetName = params.get('file') || 'index.html';
        const iframe = document.getElementById('output');
        let lastUrl = "";

        async function poll() {
            try {
                const res = await fetch('/api/action?list=true');
                const blobs = await res.json();
                
                // Filtrujemy po nazwie i bierzemy NAJNOWSZY plik (data uploadu)
                const latest = blobs
                    .filter(b => b.pathname === targetName)
                    .sort((a, b) => new Date(b.uploadedAt) - new Date(a.uploadedAt))[0];

                if (latest && latest.url !== lastUrl) {
                    lastUrl = latest.url;
                    // Pobieramy surowy kod i wstrzykujemy przez srcdoc
                    const contentRes = await fetch(latest.url + '?t=' + Date.now());
                    iframe.srcdoc = await contentRes.text();
                }
            } catch (e) {}
        }

        setInterval(poll, 1000);
        poll();
    </script>
</body>
</html>
