<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <style>
        body, html { margin: 0; padding: 0; height: 100vh; overflow: hidden; background: #000; }
        iframe { border: none; width: 100%; height: 100%; display: block; }
    </style>
</head>
<body>
    <iframe id="v"></iframe>
    <script>
        (async () => {
            try {
                const res = await fetch('/api/action?list=true');
                const blobs = await res.json();
                const index = blobs.find(b => b.pathname === 'index.html');
                if (index) {
                    document.getElementById('v').src = index.url + '?download=false&t=' + Date.now();
                }
            } catch (e) {}
        })();
    </script>
</body>
</html>
