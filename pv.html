<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Live Preview</title>
    <style>
        body, html { margin: 0; padding: 0; height: 100%; overflow: hidden; }
        iframe { border: none; width: 100%; height: 100%; }
        #msg { font-family: sans-serif; padding: 20px; text-align: center; color: #666; }
    </style>
</head>
<body>
    <iframe id="viewer" style="display:none;"></iframe>

    <script>
        async function launch() {
            try {
                // 1. Pobieramy listę plików z Bloba
                const res = await fetch('/api/action?list=true');
                const blobs = await res.json();
                
                // 2. Szukamy index.html
                const indexFile = blobs.find(b => b.pathname === 'index.html');
                
                if (indexFile) {
                    const iframe = document.getElementById('viewer');
                    const msg = document.getElementById('msg');
                    
                    // 3. Ustawiamy src iframe'a na URL z Bloba (z Twoim fixem na pobieranie!)
                    iframe.src = `${indexFile.url}?download=false&t=${Date.now()}`;
                    
                    iframe.onload = () => {
                        msg.style.display = 'none';
                        iframe.style.display = 'block';
                    };
                } else {
                    document.getElementById('msg').innerText = "Error: index.html not found in Blob storage.";
                }
            } catch (e) {
                document.getElementById('msg').innerText = "Failed to load project.";
            }
        }

        launch();
    </script>
</body>
</html>
