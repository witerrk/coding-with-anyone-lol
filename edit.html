<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Editor</title>
    <style>
        :root { 
            --sidebar-bg: #252526; 
            --editor-bg: #1e1e1e; 
            --text-color: #cccccc; 
            --active-item: #37373d;
            --accent: #007acc;
        }
        body { margin: 0; display: flex; height: 100vh; background: var(--editor-bg); font-family: 'Segoe UI', sans-serif; color: white; overflow: hidden; }
        #sidebar { width: 260px; background: var(--sidebar-bg); border-right: 1px solid #333; display: flex; flex-direction: column; user-select: none; }
        .sidebar-header { padding: 15px; border-bottom: 1px solid #333; display: flex; justify-content: space-between; align-items: center; }
        #sidebar h3 { font-size: 11px; margin: 0; text-transform: uppercase; letter-spacing: 1px; opacity: 0.6; }
        #new-file-btn { background: none; border: none; color: var(--text-color); cursor: pointer; font-size: 20px; padding: 0 5px; }
        #new-file-btn:hover { color: white; }
        #file-list { overflow-y: auto; flex-grow: 1; }
        .file-item { padding: 10px 20px; cursor: pointer; font-size: 13px; color: var(--text-color); border-bottom: 1px solid #2d2d2d; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .file-item:hover { background: #2a2d2e; }
        .file-item.active { background: var(--active-item); color: white; }
        #main-container { flex-grow: 1; position: relative; display: flex; flex-direction: column; }
        #editor { flex-grow: 1; }
        #save-btn { position: absolute; top: 15px; right: 25px; z-index: 100; background: var(--accent); color: white; border: none; padding: 8px 18px; border-radius: 2px; cursor: pointer; font-size: 12px; font-weight: bold; }
        #save-btn:hover { background: #0062a3; }
        #loader { position: absolute; top: 20px; left: 20px; z-index: 1000; background: rgba(0,0,0,0.8); color: #fff; padding: 6px 15px; font-size: 12px; display: none; border: 1px solid #444; border-radius: 2px; }
    </style>
</head>
<body>

    <div id="sidebar">
        <div class="sidebar-header">
            <h3>Explorer</h3>
            <button id="new-file-btn" title="New File">+</button>
        </div>
        <div id="file-list"></div>
    </div>
    
    <div id="main-container">
        <button id="save-btn">Save</button>
        <div id="loader">Processing...</div>
        <div id="editor"></div>
    </div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/monaco-editor/0.44.0/min/vs/loader.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/emmet-monaco-es/dist/emmet-monaco.min.js"></script>

    <script>
        let editor, currentFile = null;

        require.config({ paths: { vs: 'https://cdnjs.cloudflare.com/ajax/libs/monaco-editor/0.44.0/min/vs' } });

        require(['vs/editor/editor.main'], function () {
            editor = monaco.editor.create(document.getElementById('editor'), {
                value: "",
                language: 'html',
                theme: 'vs-dark',
                automaticLayout: true,
                tabSize: 4,
                insertSpaces: true,
                fontSize: 14,
                minimap: { enabled: false }
            });

            if (typeof emmetMonaco !== 'undefined') emmetMonaco.emmetHTML(monaco);
            loadFiles();
        });

        async function loadFiles() {
            try {
                const res = await fetch('/api/action?list=true');
                const blobs = await res.json();
                const listContainer = document.getElementById('file-list');
                listContainer.innerHTML = "";
                blobs.forEach(blob => {
                    const div = document.createElement('div');
                    div.className = 'file-item';
                    div.innerText = blob.pathname;
                    div.onclick = () => openFile(blob, div);
                    listContainer.appendChild(div);
                });
            } catch (e) { console.error("Load failed", e); }
        }

        async function openFile(blob, element) {
            const loader = document.getElementById('loader');
            loader.style.display = "block";
            try {
                // CACHE BUSTING: Dodajemy timestamp, aby zawsze pobierać nową wersję
                const freshUrl = `${blob.url}?t=${Date.now()}`;
                const res = await fetch(freshUrl);
                const content = await res.text();

                document.querySelectorAll('.file-item').forEach(el => el.classList.remove('active'));
                element.classList.add('active');

                const ext = blob.pathname.split('.').pop();
                const lang = ext === 'js' ? 'javascript' : (ext === 'css' ? 'css' : 'html');
                
                monaco.editor.setModelLanguage(editor.getModel(), lang);
                editor.setValue(content);
                currentFile = blob.pathname;
            } catch (err) { alert("Load failed"); }
            loader.style.display = "none";
        }

        document.getElementById('new-file-btn').onclick = async () => {
            const fileName = prompt("New file name:");
            if (!fileName) return;
            const loader = document.getElementById('loader');
            loader.style.display = "block";
            try {
                const res = await fetch('/api/action', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ name: fileName, content: " " })
                });
                if (res.ok) await loadFiles();
            } catch (e) { alert("Error"); }
            loader.style.display = "none";
        };

        document.getElementById('save-btn').onclick = async () => {
            if (!currentFile) return;
            const loader = document.getElementById('loader');
            loader.style.display = "block";
            try {
                const res = await fetch('/api/action', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ name: currentFile, content: editor.getValue() })
                });
                if (res.ok) {
                    console.log("Saved!");
                    // Opcjonalnie przeładowujemy listę, by zaktualizować URL-e
                    await loadFiles();
                }
            } catch (e) { alert("Save failed"); }
            loader.style.display = "none";
        };
    </script>
</body>
</html>
