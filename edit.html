<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Editor</title>
    <style>
        :root { --bg: #1e1e1e; --sidebar: #252526; --text: #ccc; --accent: #007acc; }
        body { margin: 0; display: flex; height: 100vh; background: var(--bg); font-family: sans-serif; color: white; overflow: hidden; }
        #sidebar { width: 250px; background: var(--sidebar); border-right: 1px solid #333; display: flex; flex-direction: column; }
        .header { padding: 15px; display: flex; justify-content: space-between; border-bottom: 1px solid #333; font-size: 12px; }
        #file-list { flex-grow: 1; overflow-y: auto; }
        .file-item { padding: 8px 15px; cursor: pointer; display: flex; justify-content: space-between; font-size: 13px; border-bottom: 1px solid #2d2d2d; }
        .file-item:hover { background: #2a2d2e; }
        .file-item.active { background: #37373d; }
        .del-btn { color: #f44; opacity: 0; }
        .file-item:hover .del-btn { opacity: 1; }
        #main { flex-grow: 1; position: relative; }
        .toolbar { position: absolute; top: 10px; right: 20px; z-index: 10; display: flex; gap: 5px; }
        button { background: var(--accent); color: white; border: none; padding: 5px 12px; cursor: pointer; font-size: 12px; }
        #preview-btn { background: #444; }
        #editor { height: 100%; width: 100%; }
    </style>
</head>
<body>
    <div id="sidebar">
        <div class="header">EXPLORER <span id="add" style="cursor:pointer">+</span></div>
        <div id="file-list"></div>
    </div>
    <div id="main">
        <div class="toolbar">
            <button id="preview-btn">Preview</button>
            <button id="save-btn">Save</button>
        </div>
        <div id="editor"></div>
    </div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/monaco-editor/0.44.0/min/vs/loader.min.js"></script>
    <script>
        let editor, currentFile = null, blobs = [];
        require.config({ paths: { vs: 'https://cdnjs.cloudflare.com/ajax/libs/monaco-editor/0.44.0/min/vs' } });
        require(['vs/editor/editor.main'], () => {
            editor = monaco.editor.create(document.getElementById('editor'), {
                value: "", language: 'html', theme: 'vs-dark', automaticLayout: true
            });
            load();
        });

        async function load() {
            const res = await fetch('/api/action?list=true');
            blobs = await res.json();
            const list = document.getElementById('file-list');
            list.innerHTML = "";
            blobs.forEach(b => {
                const item = document.createElement('div');
                item.className = `file-item ${currentFile === b.pathname ? 'active' : ''}`;
                item.innerHTML = `<span>${b.pathname}</span>`;
                if(b.pathname !== 'index.html') {
                    const del = document.createElement('span');
                    del.className = 'del-btn'; del.innerHTML = '&times;';
                    del.onclick = (e) => { e.stopPropagation(); remove(b); };
                    item.appendChild(del);
                }
                item.onclick = () => open(b);
                list.appendChild(item);
            });
        }

        async function open(b) {
            const res = await fetch(`${b.url}?t=${Date.now()}`);
            editor.setValue(await res.text());
            currentFile = b.pathname;
            load();
        }

        document.getElementById('save-btn').onclick = async () => {
            if(!currentFile) return;
            await fetch('/api/action', {
                method: 'POST',
                body: JSON.stringify({ name: currentFile, content: editor.getValue() })
            });
        };

        document.getElementById('preview-btn').onclick = () => {
            const b = blobs.find(x => x.pathname === currentFile);
            if(b) window.open(`${b.url}?download=false&t=${Date.now()}`, '_blank');
        };

        document.getElementById('add').onclick = async () => {
            const n = prompt("Name:");
            if(n) {
                await fetch('/api/action', { method: 'POST', body: JSON.stringify({ name: n, content: " " }) });
                load();
            }
        };

        async function remove(b) {
            if(confirm("Delete?")) {
                await fetch(`/api/action?url=${encodeURIComponent(b.url)}&name=${b.pathname}`, { method: 'DELETE' });
                load();
            }
        }
    </script>
</body>
</html>
