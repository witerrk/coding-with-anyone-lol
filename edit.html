<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Editor</title>
    <style>
        :root { 
            --sidebar-bg: #252526; 
            --editor-bg: #1e1e1e; 
            --text-color: #cccccc; 
            --active-item: #37373d;
            --accent: #007acc;
            --danger: #f14c4c;
        }

        body { 
            margin: 0; 
            display: flex; 
            height: 100vh; 
            background: var(--editor-bg); 
            font-family: 'Segoe UI', sans-serif; 
            color: white; 
            overflow: hidden;
        }
        
        /* Sidebar */
        #sidebar { 
            width: 260px; 
            background: var(--sidebar-bg); 
            border-right: 1px solid #333; 
            display: flex;
            flex-direction: column;
            user-select: none;
        }

        .sidebar-header {
            padding: 15px;
            border-bottom: 1px solid #333;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        #sidebar h3 { 
            font-size: 11px; 
            margin: 0; 
            text-transform: uppercase; 
            letter-spacing: 1px; 
            opacity: 0.6; 
        }

        #new-file-btn {
            background: none;
            border: none;
            color: var(--text-color);
            cursor: pointer;
            font-size: 20px;
            padding: 0 5px;
        }
        #new-file-btn:hover { color: white; }

        #file-list { overflow-y: auto; flex-grow: 1; }

        .file-item { 
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 8px 15px 8px 20px; 
            cursor: pointer; 
            font-size: 13px; 
            color: var(--text-color);
            border-bottom: 1px solid #2d2d2d;
        }
        .file-item:hover { background: #2a2d2e; }
        .file-item.active { background: var(--active-item); color: white; }

        .file-name { flex-grow: 1; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

        .delete-btn {
            color: var(--danger);
            font-size: 18px;
            font-weight: bold;
            padding: 0 5px;
            opacity: 0;
            transition: opacity 0.2s;
            cursor: pointer;
        }
        .file-item:hover .delete-btn { opacity: 1; }
        .delete-btn:hover { color: #ff0000; scale: 1.2; }

        /* Main Area */
        #main-container { flex-grow: 1; position: relative; display: flex; flex-direction: column; }
        #editor { flex-grow: 1; }

        .toolbar {
            position: absolute;
            top: 15px;
            right: 25px;
            z-index: 100;
            display: flex;
            gap: 10px;
        }

        button.action-btn {
            border: none;
            padding: 8px 15px;
            border-radius: 2px;
            cursor: pointer;
            font-size: 12px;
            font-weight: bold;
            color: white;
        }

        #preview-btn { background: #3a3d41; border: 1px solid #555; }
        #preview-btn:hover { background: #45494e; }
        #save-btn { background: var(--accent); }
        #save-btn:hover { background: #0062a3; }

        #loader {
            position: absolute;
            top: 20px;
            left: 20px;
            z-index: 1000;
            background: rgba(0,0,0,0.8);
            padding: 6px 15px;
            font-size: 12px;
            display: none;
            border: 1px solid #444;
        }
    </style>
</head>
<body>

    <div id="sidebar">
        <div class="sidebar-header">
            <h3>Explorer</h3>
            <button id="new-file-btn" title="New File">+</button>
        </div>
        <div id="file-list"></div>
    </div>
    
    <div id="main-container">
        <div class="toolbar">
            <button id="preview-btn" class="action-btn">Preview</button>
            <button id="save-btn" class="action-btn">Save</button>
        </div>
        <div id="loader">Processing...</div>
        <div id="editor"></div>
    </div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/monaco-editor/0.44.0/min/vs/loader.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/emmet-monaco-es/dist/emmet-monaco.min.js"></script>

    <script>
        let editor, currentFile = null, currentBlobs = [];

        require.config({ paths: { vs: 'https://cdnjs.cloudflare.com/ajax/libs/monaco-editor/0.44.0/min/vs' } });

        require(['vs/editor/editor.main'], function () {
            editor = monaco.editor.create(document.getElementById('editor'), {
                value: "",
                language: 'html',
                theme: 'vs-dark',
                automaticLayout: true,
                fontSize: 14,
                minimap: { enabled: false }
            });

            if (typeof emmetMonaco !== 'undefined') emmetMonaco.emmetHTML(monaco);
            loadFiles();
        });

        async function loadFiles() {
            try {
                const res = await fetch('/api/action?list=true');
                currentBlobs = await res.json();
                const listContainer = document.getElementById('file-list');
                listContainer.innerHTML = "";
                
                currentBlobs.forEach(blob => {
                    const div = document.createElement('div');
                    div.className = 'file-item';
                    if (currentFile === blob.pathname) div.classList.add('active');

                    const nameSpan = document.createElement('span');
                    nameSpan.className = 'file-name';
                    nameSpan.innerText = blob.pathname;
                    nameSpan.onclick = () => openFile(blob, div);
                    
                    div.appendChild(nameSpan);

                    // Przycisk usuwania (blokada dla index.html)
                    if (blob.pathname !== 'index.html') {
                        const delBtn = document.createElement('span');
                        delBtn.className = 'delete-btn';
                        delBtn.innerHTML = '&times;';
                        delBtn.onclick = (e) => {
                            e.stopPropagation();
                            deleteFile(blob);
                        };
                        div.appendChild(delBtn);
                    }
                    
                    listContainer.appendChild(div);
                });
            } catch (e) { console.error("Load failed"); }
        }

        async function openFile(blob, element) {
            const loader = document.getElementById('loader');
            loader.style.display = "block";
            try {
                const res = await fetch(`${blob.url}?t=${Date.now()}`);
                const content = await res.text();

                document.querySelectorAll('.file-item').forEach(el => el.classList.remove('active'));
                element.classList.add('active');

                const ext = blob.pathname.split('.').pop();
                const lang = ext === 'js' ? 'javascript' : (ext === 'css' ? 'css' : 'html');
                
                monaco.editor.setModelLanguage(editor.getModel(), lang);
                editor.setValue(content);
                currentFile = blob.pathname;
            } catch (err) { alert("Load failed"); }
            loader.style.display = "none";
        }

        document.getElementById('new-file-btn').onclick = async () => {
            const fileName = prompt("File name (e.g. style.css):");
            if (!fileName) return;
            showLoader(true);
            try {
                await fetch('/api/action', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ name: fileName, content: " " })
                });
                await loadFiles();
            } finally { showLoader(false); }
        };

        document.getElementById('save-btn').onclick = async () => {
            if (!currentFile) return;
            showLoader(true);
            try {
                await fetch('/api/action', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ name: currentFile, content: editor.getValue() })
                });
            } finally { showLoader(false); }
        };

        document.getElementById('preview-btn').onclick = () => {
            if (!currentFile) return alert("Select a file");
            const file = currentBlobs.find(b => b.pathname === currentFile);
            if (file) window.open(`${file.url}?t=${Date.now()}`, '_blank');
        };

        async function deleteFile(blob) {
            if (!confirm(`Delete ${blob.pathname}?`)) return;
            showLoader(true);
            try {
                const res = await fetch(`/api/action?url=${encodeURIComponent(blob.url)}&name=${blob.pathname}`, {
                    method: 'DELETE'
                });
                if (res.ok) {
                    if (currentFile === blob.pathname) { editor.setValue(""); currentFile = null; }
                    await loadFiles();
                }
            } finally { showLoader(false); }
        }

        function showLoader(show) { document.getElementById('loader').style.display = show ? "block" : "none"; }
    </script>
</body>
</html>
